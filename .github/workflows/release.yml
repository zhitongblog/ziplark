name: Release
# Builds and attaches downloadable artifacts to a GitHub release:
#   • CLI + MCP binaries for Linux, Windows, Intel-Mac and Apple-Silicon
#   • Desktop installers for Linux (.deb/.AppImage) and Windows (.msi/.exe)
# The macOS desktop app (.dmg) is built, signed and *notarized* on the
# maintainer's Mac (see scripts/release-macos.sh) and uploaded separately.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  # The mcpb job authenticates to the MCP registry with an OIDC token rather
  # than a stored secret.
  id-token: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Ziplark ${{ steps.tag.outputs.tag }}
          draft: false
          fail_on_unmatched_files: false

  cli:
    needs: create-release
    name: cli ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build CLI + MCP (release)
        run: cargo build --release --target ${{ matrix.target }} -p ziplark-cli -p ziplark-mcp
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          dir="ziplark-${tag}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/ziplark" \
             "target/${{ matrix.target }}/release/ziplark-mcp" \
             README.md LICENSE THIRD_PARTY_LICENSES.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Clean-machine smoke test (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: pwsh scripts/windows-smoke.ps1 -BinDir target/${{ matrix.target }}/release -SkipGui

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ needs.create-release.outputs.tag }}"
          $dir = "ziplark-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ziplark.exe",
                    "target/${{ matrix.target }}/release/ziplark-mcp.exe",
                    README.md, LICENSE, THIRD_PARTY_LICENSES.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower() + "  $dir.zip" |
            Out-File -Encoding ascii "$dir.zip.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            ziplark-*.tar.gz
            ziplark-*.tar.gz.sha256
            ziplark-*.zip
            ziplark-*.zip.sha256

  desktop:
    needs: create-release
    name: desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, bundles: "deb,appimage", extraArgs: "" }
          - { os: windows-latest, bundles: "msi,nsis", extraArgs: "--target x86_64-pc-windows-msvc" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux webkit deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # `tauri build` recompiles the GUI with the `custom-protocol` feature and
      # overwrites whatever a plain `cargo build` produced, so smoke-testing a
      # cargo-built exe would verify a binary we never ship. Do the tauri build
      # here, verify *that* exe, and let tauri-action's own build below land on
      # the same fingerprint (a cache hit) before it bundles and uploads.
      - name: Build GUI + clean-machine smoke test (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm install -g @tauri-apps/cli@v2
          cargo build --release --target x86_64-pc-windows-msvc -p ziplark-cli -p ziplark-mcp
          tauri build --no-bundle --target x86_64-pc-windows-msvc
          pwsh scripts/windows-smoke.ps1 -BinDir target/x86_64-pc-windows-msvc/release

      - name: Build & upload desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: Ziplark ${{ needs.create-release.outputs.tag }}
          args: --bundles ${{ matrix.bundles }} ${{ matrix.extraArgs }}

  # The MCP Bundle: one artifact carrying the server for all three platforms.
  # It is how the official MCP registry accepts a compiled server — and being
  # listed there is what feeds the MCP directories. Runs after the CLI jobs,
  # since it packs the very binaries they published.
  mcpb:
    needs: [create-release, cli]
    name: mcpb bundle
    # macOS, because the bundle carries a universal macOS binary and `lipo`
    # is what makes one.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published CLI archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          mkdir -p dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "ziplark-$tag-*.tar.gz" --pattern "ziplark-$tag-*.zip"
          ls -l dist
      - name: Build the bundle
        run: bash scripts/build-mcpb.sh dist dist/mcpb
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            dist/mcpb/*.mcpb
            dist/mcpb/*.mcpb.sha256

      # Then tell the official MCP registry about it. server.json in the repo
      # points at whatever release it was last published for, so it is rewritten
      # here from the bundle that was just built — the registry rejects an entry
      # whose fileSha256 does not match what the URL serves.
      - name: Point server.json at this release
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          version="${tag#v}"
          bundle="dist/mcpb/ziplark-mcp-$version.mcpb"
          sha="$(shasum -a 256 "$bundle" | cut -d' ' -f1)"
          python3 - "$version" "$tag" "$sha" <<'PY'
          import json, sys
          version, tag, sha = sys.argv[1:4]
          manifest = json.load(open("server.json"))
          manifest["version"] = version
          pkg = manifest["packages"][0]
          pkg["identifier"] = (
              "https://github.com/zhitongblog/ziplark/releases/download/"
              f"{tag}/ziplark-mcp-{version}.mcpb"
          )
          pkg["fileSha256"] = sha
          json.dump(manifest, open("server.json", "w"), indent=2, ensure_ascii=False)
          print(json.dumps(pkg, indent=2))
          PY
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP registry
        # Best-effort: the bundle is already attached to the release by now, and
        # a registry hiccup should not turn a good release red. Re-runnable by
        # hand with `mcp-publisher login github && mcp-publisher publish`.
        continue-on-error: true
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
